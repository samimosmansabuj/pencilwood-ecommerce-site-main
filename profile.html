<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — Pencilwood</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/home.css?v=2">
  <link rel="stylesheet" href="css/profile.css">
</head>

<body>

  <div id="toast-container"></div>
  <div id="drawer-container"></div>
  <div id="topnavbar-container"></div>
  <div id="subnavbar-container"></div>
  <div id="bc-br" class="bc-br-section"></div>

  <div class="page">

    <h1>My Profile</h1>

    <div class="profile-card">

      <div class="profile-row">
        <label>Full Name</label>
        <input id="profileFullName" type="text" placeholder="Enter your full name">
      </div>

      <div class="profile-row">
        <label>Phone</label>
        <input id="profilePhone" type="text" placeholder="Enter your phone number">
      </div>

      <div class="profile-row">
        <label>WhatsApp Number</label>
        <input id="profileWhatsapp" type="text" placeholder="Enter WhatsApp number">
      </div>

      <div class="profile-row">
        <label>Email</label>
        <input id="profileEmail" type="text" placeholder="Enter email">
      </div>

      <button onclick="saveProfile()">Save Changes</button>

    </div>

    <div class="account-links">
      <a href="my-orders.html">📦 My Orders</a>
      <a href="address.html">📍 Address Book</a>
      <a href="cart.html">🛒 Cart</a>
      <button class="logout-btn-profile" onclick="logoutUser()">

        ⏻ Logout

      </button>
    </div>

  </div>

  <!-- FOOTER -->
  <div class="footer-section">
    <div id="eco-container"></div>
    <div id="footer-container"></div>
  </div>

  <script src="js/env.js"></script>
  <script src="js/marketing.js"></script>
  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
  <script src="js/loadComponents.js"></script>
  <script src="js/site-content.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/auth.js"></script>


</body>

</html>
