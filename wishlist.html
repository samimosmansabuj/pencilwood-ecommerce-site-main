<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Wishlist — Pencilwood
    </title>

    <meta name="description" content="Explore Pencilwood premium products wishlist.">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Sora:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/home.css?v=2">

    <link rel="stylesheet" href="css/products.css?v=2">

    <link rel="stylesheet" href="css/wishlist.css?v=2">

    <link rel="stylesheet" href="css/product.css?v=2">

</head>

<body>

    <!-- COMPONENTS -->
    <div id="toast-container"></div>

    <div id="float-wa"></div>

    <div id="drawer-container"></div>

    <div id="topnavbar-container"></div>

    <div id="subnavbar-container"></div>

    <div id="bc-br" class="bc-br-section"></div>

    <!-- PAGE -->
    <div class="page">

        <div class="wishlist-head">

            <h1 class="wishlist-title">
                My Wishlist ❤️
            </h1>

            <div class="wishlist-count" id="wishlistCountText">

                0 Items

            </div>

        </div>

        <!-- WISHLIST GRID -->
        <div class="wishlist-grid" id="wishlistContainer">

            <p>Loading wishlist...</p>

        </div>

        <!-- EMPTY -->
        <div class="wishlist-empty" id="emptyWishlist" style="display:none">

            <div class="empty-icon">
                ❤️
            </div>

            <div class="empty-title">
                Your wishlist is empty
            </div>

            <div class="empty-sub">
                Save your favorite Pencilwood products
            </div>

            <button class="btn-shop" onclick="window.location.href='product-list.html'">

                Continue Shopping

            </button>

        </div>

    </div>

    <!-- FOOTER -->
    <div class="footer-section">
        <div id="eco-container"></div>
        <div id="footer-container"></div>
    </div>

    <!-- JS -->
    <script src="js/env.js"></script>
    <script src="js/config.js"></script>
    <script src="js/main.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/loadComponents.js"></script>
    <script src="js/wishlist.js"></script>

</body>

</html>
