<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shopping Cart — Pencilwood</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Sora:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="css/home.css?v=2">
  <link rel="stylesheet" href="css/cart.css?v=2">

</head>

<body>

  <div id="toast-container"></div>
  <div id="float-wa"></div>
  <div id="drawer-container"></div>
  <div id="topnavbar-container"></div>
  <div id="subnavbar-container"></div>
  <div id="bc-br" class="bc-br-section"></div>

  <div class="page">

    <div class="cart-head">
      <h1 class="cart-title">My Cart</h1>
      <div class="cart-count" id="cartItemCount">0 Items</div>
    </div>

    <div class="cart-layout">

      <!-- LEFT -->
      <div class="cart-left">
        <div class="cart-items" id="cartItemsContainer">
          <p>Loading cart...</p>
        </div>
      </div>

      <!-- RIGHT -->
      <div class="cart-right">
        <div class="cart-summary">
          <div class="summary-title">Order Summary</div>
          <div id="cartSummaryList"></div>
          <!-- ONLY SUBTOTAL -->
          <div class="summary-row">
            <span>Subtotal</span>
            <span id="cartSubtotal">৳ 0</span>
          </div>
          <button class="btn-checkout" onclick="goToCheckout()">
            Proceed to Checkout
          </button>
        </div>
      </div>

    </div>

    <div class="cart-empty" id="emptyCartBox" style="display:none">
      <div class="empty-icon">🛒</div>
      <div class="empty-title">Your cart is empty</div>
      <div class="empty-sub">Browse premium Pencilwood products</div>

      <button class="btn-checkout" onclick="window.location.href='product-list.html'">
        Continue Shopping
      </button>
    </div>

  </div>

  <!-- FOOTER -->
  <div class="footer-section">
    <div id="eco-container"></div>
    <div id="footer-container"></div>
  </div>

  <!-- JS -->
  <script src="js/env.js"></script>
  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/loadComponents.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>


</body>

</html>
