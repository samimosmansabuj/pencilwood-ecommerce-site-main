<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Products — Pencilwood Leather Bangladesh</title>
  <meta name="description"
    content="Explore Pencilwood Leather's collection of wallets, belts, card holders, and accessories. Premium genuine leather products. Free delivery in Dhaka.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Sora:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/home.css?v=2">
  <link rel="stylesheet" href="css/products.css?v=2">
  <link rel="stylesheet" href="css/product.css?v=2"></head>

<body>

  <!-- Components placeholders -->
  <div id="toast-container"></div>
  <div id="float-wa"></div>
  <div id="drawer-container"></div>

  <div id="topnavbar-container"></div>
  <div id="subnavbar-container"></div>
  <div id="bc-br" class="bc-br-section"></div>

  <!-- PAGE CONTENT -->
  <div class="page">

    <!-- ① PAGE HEADER -->
    <div class="lp-section">
      <div class="lp-head">
        <div class="lp-title">All Products</div>
        <div class="lp-sub">Browse our premium leather collection</div>
      </div>
    </div>

    <!-- ② FILTER / SORT -->
    <div class="filter-bar">
      <div class="filter-left">
        <label><span>Category:</span>
          <select id="filterCategory" onchange="applyFilters()">
            <option value="all">All</option>
            <option value="wallet">Wallet</option>
            <option value="belt">Belt</option>
            <option value="card-holder">Card Holder</option>
            <option value="accessories">Accessories</option>
            <option value="passport-holder">Passport Holder</option>
          </select>
        </label>

        <label><span>Sort by:</span>
          <select id="sortBy" onchange="applyFilters()">
            <option value="popularity">Popularity</option>
            <option value="price-low-high">Price: Low to High</option>
            <option value="price-high-low">Price: High to Low</option>
            <option value="newest">Newest</option>
          </select>
        </label>
      </div>

      <div class="filter-right">
        <span id="totalProducts">Loading products...</span>
      </div>
    </div>

    <!-- ③ PRODUCT GRID -->
    <div class="products-grid" id="productsGrid">
    </div>

    <!-- ④ PAGINATION -->
    <div class="pagination">
      <button onclick="goPage(1)">« First</button>
      <button onclick="prevPage()">‹ Prev</button>
      <span id="pageNumbers"></span>
      <button onclick="nextPage()">Next ›</button>
      <button onclick="goPage(5)">Last »</button>
    </div>

    <!-- SOCIAL PROOF -->
    <div class="proof-banner">
      <div class="proof-stat">
        <div class="proof-num">500+</div>
        <div class="proof-lbl">Happy Customers</div>
      </div>
      <div class="proof-stat">
        <div class="proof-num">4.8★</div>
        <div class="proof-lbl">Average Rating</div>
      </div>
      <div class="proof-stat">
        <div class="proof-num">100%</div>
        <div class="proof-lbl">Genuine Leather</div>
      </div>
      <div class="proof-stat">
        <div class="proof-num">0%</div>
        <div class="proof-lbl">Return Rate</div>
      </div>
    </div>

    <div id="eco-container"></div>

  </div>

  <!-- JS -->
  <script src="js/env.js"></script>
  <script src="js/main.js"></script>
  <script src="js/loadComponents.js"></script>
  <script src="js/product_list.js"></script>

  <!-- <script>
    // ONLY SAFE BRIDGE (NO OLD FILTER LOGIC)
    function applyFilters() {
      if (window.applyFilters) {
        window.applyFilters();
      }
    }
  </script> -->

</body>
</html>
