<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Signup — Pencilwood</title>

  <meta name="description"
    content="Explore Pencilwood Leather's collection of wallets, belts, card holders, and accessories.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/home.css?v=2">
  <link rel="stylesheet" href="css/products.css?v=2">
  <link rel="stylesheet" href="css/product.css?v=2">
</head>

<body>

  <div id="toast-container"></div>
  <div id="float-wa"></div>
  <div id="drawer-container"></div>

  <div id="topnavbar-container"></div>
  <div id="subnavbar-container"></div>
  <div id="bc-br" class="bc-br-section"></div>

  <div class="auth-page">

    <div class="auth-box">

      <div class="auth-tabs">
        <button class="tab on" onclick="switchAuth('login')">Login</button>
        <button class="tab" onclick="switchAuth('signup')">Signup</button>
      </div>

      <!-- LOGIN -->
      <div id="loginForm" class="auth-form">

        <input type="text" id="loginPhone" placeholder="Phone Number">

        <input type="password" id="loginPassword" placeholder="Password">

        <button onclick="loginUser()">
          Login
        </button>

      </div>

       <!-- SIGNUP -->
       <div id="signupForm" class="auth-form" style="display:none">

        <input type="text" id="signupName" placeholder="Full Name">

        <input type="text" id="signupPhone" placeholder="Phone Number">

        <input type="email" id="signupEmail" placeholder="Email (optional)">

        <input type="password" id="signupPassword" placeholder="Password">

        <button onclick="signupUser()">
          Create Account
        </button>

      </div>

    </div>

  </div>

  <div id="eco-container"></div>

  <!-- IMPORTANT ORDER -->
  <script src="js/env.js"></script>
  <script src="js/loadComponents.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>

</body>  

</html>
