<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Pencilwood</title>

  <meta name="description"
    content="Explore Pencilwood Leather's collection of wallets, belts, card holders, and accessories.">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Sora:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/home.css?v=2">
  <link rel="stylesheet" href="css/products.css?v=2">
  <link rel="stylesheet" href="css/product.css?v=2">

</head>

<body>

  <!-- COMPONENTS -->
  <div id="toast-container"></div>
  <div id="float-wa"></div>
  <div id="drawer-container"></div>
  <div id="topnavbar-container"></div>
  <div id="subnavbar-container"></div>
  <div id="bc-br" class="bc-br-section"></div>

  <!-- AUTH PAGE -->
  <div class="auth-page">

    <div class="auth-box">

      <div class="auth-tabs">
        <button class="tab on">Login</button>
      </div>

      <!-- STEP 1: PHONE -->
      <div id="phoneStep" class="auth-form">
        <input type="tel" id="loginPhone" placeholder="Phone Number (e.g. 01XXXXXXXXX)">
        <button onclick="submitPhoneStep()">Next</button>
      </div>

      <!-- STEP 2: PASSWORD -->
      <div id="passwordStep" class="auth-form" style="display:none">

        <p id="passwordStepLabel" style="margin:0 0 5px; font-size:14px; color:#555;">
          Enter your password
        </p>

        <div id="setPasswordNameField" style="display:none;">
          <input type="text" id="setPasswordName" placeholder="Your Name">
        </div>

        <input type="password" id="loginPassword" placeholder="Password">

        <button onclick="submitPasswordStep()">Continue</button>

        <button type="button" onclick="backToPhoneStep()"
          style="background:transparent; color:#666; box-shadow:none;">
          ← Back
        </button>

      </div>

    </div>

  </div>

  <!-- FOOTER -->
  <div class="footer-section">
    <div id="eco-container"></div>
    <div id="footer-container"></div>
  </div>

  <!-- JS -->
  <script src="js/env.js"></script>
  <script src="js/config.js"></script>
  <script src="js/loadComponents.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>

  <div id="loginLoader" class="login-loader">
    <div class="loader-box">
      <div class="spinner"></div>
      <p>Please wait...</p>
    </div>
  </div>

</body>

</html>
