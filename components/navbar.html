<script>
  /* =========================
     UPDATE AUTH BUTTONS
  ========================= */
  function updateAuthButtons() {
  
    const authBtn =
      document.getElementById("authNavBtn");
  
    const drawerAuthBtn =
      document.getElementById("drawerAuthBtn");
  
    if (!authBtn || !drawerAuthBtn) {
      return;
    }
  
    /* USER LOGGED IN */
    if (isLoggedIn()) {
  
      authBtn.innerHTML = `
        <span class="nav-ic-icon">🚪</span>
        Logout
      `;
  
      drawerAuthBtn.innerHTML =
        "🚪 Logout";
  
      authBtn.onclick = async function () {
  
        await logoutUser();
      };
  
      drawerAuthBtn.onclick = async function () {
  
        await logoutUser();
      };
    }
  
    /* USER NOT LOGGED IN */
    else {
  
      authBtn.innerHTML = `
        <span class="nav-ic-icon">🔑</span>
        Login
      `;
  
      drawerAuthBtn.innerHTML =
        "🔑 Login";
  
      authBtn.onclick = function () {
  
        window.location.href =
          "login.html";
      };
  
      drawerAuthBtn.onclick = function () {
  
        window.location.href =
          "login.html";
      };
    }
  }
  
  /* =========================
     INIT
  ========================= */
  updateAuthButtons();
  </script>
