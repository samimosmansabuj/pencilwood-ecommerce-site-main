<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders — Pencilwood</title>

  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/orders.css">
</head>

<body>

  <div id="toast-container"></div>
  <div id="drawer-container"></div>
  <div id="topnavbar-container"></div>
  <div id="subnavbar-container"></div>

  <div id="bc-br" class="bc-br-section"></div>

  <div class="page">

    <h1 class="orders-title">My Orders</h1>

    <!-- FILTER -->
    <div class="orders-filter">
      <button class="of-btn active" onclick="filterOrders('all', this)">All</button>
      <button class="of-btn" onclick="filterOrders('new', this)">Pending</button>
      <button class="of-btn" onclick="filterOrders('follow_up', this)">Follow Up</button>
      <button class="of-btn" onclick="filterOrders('confirmed', this)">Confirmed</button>
      <button class="of-btn" onclick="filterOrders('shipped', this)">Shipped</button>
      <button class="of-btn" onclick="filterOrders('delivered', this)">Delivered</button>
      <button class="of-btn" onclick="filterOrders('cancelled', this)">Cancelled</button>
      <button class="of-btn" onclick="filterOrders('returned', this)">Returned</button>
    </div>

    <!-- LIST -->
    <div class="orders-list" id="ordersList"></div>

  </div>

  <div id="eco-container"></div>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
  <script src="js/loadComponents.js"></script>
  <script src="js/my-orders.js"></script>

</body>

</html>
